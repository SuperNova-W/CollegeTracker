spring.application.name=college-tracker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# College Scorecard API
college.scorecard.api-key=${COLLEGE_SCORECARD_API_KEY:YL8Sxlf50kVdq3rFvoOb9DOwU0SJoTRMyabmcAB1}
college.scorecard.base-url=https://api.data.gov/ed/collegescorecard/v1/schools

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Server
server.port=8080
